#
# Merge-request gate through Forge CI's GitLab check component. The release
# policy includes this file for merge-request pipelines only; it runs in a
# digest-pinned, non-root Java image and holds no release credential.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
variables:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
include:
  - component: $CI_SERVER_FQDN/itiquette/forge-ci/check@2f4e845cee96973d1082bf00a5a18689c1482148
    inputs:
      engine-project: itiquette/forge-ci
      job-image: $CI_JOB_IMAGE
      commands:
        - bash .gitlab/check-release.sh
