# The checks this small demo project keeps; the pull-request gate adds its
# floor (secrets, sast) whatever this file says.
[detect]
auto = true

[verify]
checks = ["secrets", "sast", "typos", "yaml", "markdown"]

[policy]
block = ["secrets", "sast", "typos", "yaml", "markdown"]
