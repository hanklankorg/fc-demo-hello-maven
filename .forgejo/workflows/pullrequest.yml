#
# Forge CI pull-request gate for a Maven application. No job receives a
# secret or installs anything:
#
#   trust-boundary  statically verifies release.yml's secret boundaries
#   build           mvn tests and package, with the action the release uses
name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

jobs:
  trust-boundary:
    name: Release isolation gate
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - name: Set up forge-ci
        uses: https://forgejo.example/diggsweden/forge-ci/.forgejo/actions/setup-forge-ci@2f4e845cee96973d1082bf00a5a18689c1482148

      - name: Checkout repository
        run: |
          set -euo pipefail
          forge-ci platform checkout --depth 1

      - name: Verify release isolation boundaries
        uses: https://forgejo.example/diggsweden/forge-ci/.forgejo/actions/check-l3-isolation@2f4e845cee96973d1082bf00a5a18689c1482148
        with:
          build-job: build
          dist-digest-output: dist-digest

  build:
    name: Build and test
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: https://forgejo.example/diggsweden/forge-ci/.forgejo/actions/checkout-consumer@2f4e845cee96973d1082bf00a5a18689c1482148

      # Tests, checkstyle/PMD/formatter checks and the jar, by the action the
      # release build uses. No Build SBOM: nothing is published from here.
      - name: Build and test
        uses: https://forgejo.example/diggsweden/forge-ci/.forgejo/actions/build-maven@2f4e845cee96973d1082bf00a5a18689c1482148
        with:
          commit: ${{ forgejo.sha }}
          build-type: app
          build-sbom: 'false'
