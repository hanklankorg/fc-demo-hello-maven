# The pull-request gate: Nanolinter with its floor, and the Maven build and
# tests, through Forge CI's pull-request orchestrator.
name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: diggsweden/forge-ci/.github/workflows/pullrequest-orchestrator.yml@v0.90.0
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      forge-ci-binary-ref: v0.90.0
      project-type: maven
      lint-engine: nanolinter
      runtime-image: ghcr.io/diggsweden/forge-ci-runtime-base:v0.90.0
